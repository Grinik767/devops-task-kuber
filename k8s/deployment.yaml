apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw1-app
  namespace: homework-1
  labels:
    app: hw1-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw1-app
  template:
    metadata:
      labels:
        app: hw1-app
    spec:
      containers:
        - name: hw1-app
          image: localhost:5001/kiselev-homework:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hw1-config
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hw1-secret
                  key: APP_TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
